services:
  autorepairos:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8080"
    # ===== 憑證用 .env（已 .gitignore 排除，不進版控）=====
    # 1) 建一個 .env.example 放範例（可進版控）：
    #    LINE_CHANNEL_ID=你的 Channel ID
    #    LINE_CHANNEL_SECRET=你的 Channel Secret
    #    LINE_CHANNEL_TOKEN=你的 long-lived Channel Access Token
    # 2) 複製成 .env 再填真值：cp .env.example .env
    # 3) 三欄全空 → LINE 自動 MOCK 模式（只記錄不外送）。
    # required: false —— 沒有 .env 也能啟動。
    env_file:
      - path: .env
        required: false
    volumes:
      # 用 named volume 而非 ./data bind-mount。
      #
      # 原因：Windows bind-mount 上 SQLite 會遇到 disk I/O error (4618)。
      # 除了 WAL 不能用，連既有資料夾也可能被主機上的殘留行程鎖住而讓
      # 容器完全開不起來（曾發生在 _testbin.exe 持有 DB 時）。
      # named volume 由 Docker 管理，容器與主機都能穩定存取。
      #
      # 資料不在 ./data，查看方式：docker compose exec autorepairos ls -la /app/data
      # 取回備份：docker compose cp autorepairos:/app/data/autorepair.db ./autorepair.db
      - autorepairos-data:/app/data
    environment:
      - PORT=8080
      # DB_ENABLE_WAL 由 internal/db/db.go 讀取。named volume 可安全使用 WAL，
      # 但本機開發環境先維持關閉，避免並行寫入時的鎖競爭。
      - DB_PATH=file:/app/data/autorepair.db?_busy_timeout=5000
      - DB_ENABLE_WAL=false
      - SESSION_SECRET=autorepair-dev-secret-change-in-production
      - RUN_SEED=true

      # ===== LINE webhook（要對外推播才解開，先留註解）=====
      # LINE_CHANNEL_ID=<你的 Channel ID      例: channel-xxxxxxxxxxxxxxxx>
      # LINE_CHANNEL_SECRET=<你的 Channel Secret 例: f5e3d0...>
      # LINE_CHANNEL_TOKEN=<long-lived token    例: 7xxxx...>
      # LINE_BASE_URL=<預設官方, 不用改 例: https://api.line.me>
    restart: unless-stopped

volumes:
  autorepairos-data: