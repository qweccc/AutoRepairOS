# 每家車廠使用不同的專案名稱，Compose 會替容器與 named volume 加上此前綴。
name: ${COMPOSE_PROJECT_NAME:-autorepairos}

services:
  autorepairos:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-8090}:8080"
    # ===== 憑證用 .env（已 .gitignore 排除，不進版控）=====
    # 1) 建一個 .env.example 放範例（可進版控）：
    #    LINE_CHANNEL_ID=你的 Channel ID
    #    LINE_CHANNEL_SECRET=你的 Channel Secret
    #    LINE_CHANNEL_TOKEN=你的 long-lived Channel Access Token
    # 2) 複製成 .env 再填真值：cp .env.example .env
    # 3) 三欄全空 → LINE 自動 MOCK 模式（只記錄不外送）。
    # required: false —— 沒有 .env 也能啟動。
    env_file:
      - path: .env
        required: false
    volumes:
      # 用 named volume 而非 ./data bind-mount。
      #
      # 原因：Windows bind-mount 上 SQLite 會遇到 disk I/O error (4618)。
      # 除了 WAL 不能用，連既有資料夾也可能被主機上的殘留行程鎖住而讓
      # 容器完全開不起來（曾發生在 _testbin.exe 持有 DB 時）。
      # named volume 由 Docker 管理，容器與主機都能穩定存取。
      #
      # 資料不在 ./data，查看方式：docker compose exec autorepairos ls -la /app/data
      # 取回備份：docker compose cp autorepairos:/app/data/autorepair.db ./autorepair.db
      - autorepairos-data:/app/data
      # web/ 掛載進容器，讓 exe 與 docker 共用同一份前端檔案。
      # 改 web/ 內容兩邊立即生效，不用重新 build。
      - ./web:/app/web
    environment:
      - PORT=8080
      # DB_ENABLE_WAL 由 internal/db/db.go 以 PRAGMA 設定。DSN 的 _journal_mode
      # 對 modernc.org/sqlite 是無效參數（實測會被靜默忽略），必須靠 PRAGMA。
      # named volume 可安全使用 WAL；預設開啟，config.Load 的 fallback 也是 true。
      # WAL 讓讀寫不互斥，車廠同時有櫃檯開單、技師記工時、報表查詢時特別有感。
      - DB_PATH=file:/app/data/autorepair.db?_busy_timeout=5000
      - DB_ENABLE_WAL=${DB_ENABLE_WAL:-true}
      # 首次初始化必須由 .env 提供管理員密碼；避免使用公開可猜測的預設密碼。
      - RUN_SEED=${RUN_SEED:-false}
      - DEFAULT_OWNER_USERNAME=${DEFAULT_OWNER_USERNAME:-owner}
      - DEFAULT_OWNER_PASSWORD=${DEFAULT_OWNER_PASSWORD:-}
      - DEFAULT_COUNTER_USERNAME=${DEFAULT_COUNTER_USERNAME:-counter}
      - DEFAULT_COUNTER_PASSWORD=${DEFAULT_COUNTER_PASSWORD:-}
      - DEFAULT_TECH_USERNAME=${DEFAULT_TECH_USERNAME:-tech}
      - DEFAULT_TECH_PASSWORD=${DEFAULT_TECH_PASSWORD:-}
      - APP_NAME=${APP_NAME:-AutoRepair OS}
      # LINE、Telegram 憑證來自 .env；空值時對應整合維持停用/Mock。
      - LINE_CHANNEL_ID=${LINE_CHANNEL_ID:-}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      - LINE_CHANNEL_TOKEN=${LINE_CHANNEL_TOKEN:-}
      - LINE_BASE_URL=${LINE_BASE_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_BASE_URL=${TELEGRAM_BASE_URL:-}
      # 視覺辨識（行照/車牌 OCR）：見 .env.example 的 VISION_* 設定。
      - VISION_MODE=${VISION_MODE:-cloud}
      - VISION_API_URL=${VISION_API_URL:-}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_MODEL=${VISION_MODEL:-}
      - VISION_LOCAL_URL=${VISION_LOCAL_URL:-}
      # ===== Docker 模式視覺：指向 compose 內的 ollama 服務 =====
      # 注意用 _DOCKER 後綴的獨立變數：.env 的 VISION_LOCAL_URL 是給 exe 模式
      # （127.0.0.1:8092 本機 llama-server）用的；直接 interpolate 會把 exe 的
      # 值帶進容器（容器內的 127.0.0.1 是容器自己，連不到）。
      # ollama 容器自己管模型生命週期，不需要 autostart。
      - VISION_LOCAL_URL=${VISION_LOCAL_URL_DOCKER:-http://ollama:11434}
      - VISION_AUTOSTART=${VISION_AUTOSTART_DOCKER:-false}
      - VISION_MODEL=${VISION_MODEL_DOCKER:-qwen2.5vl:3b}

      # ===== LINE webhook（要對外推播才解開，先留註解）=====
      # LINE_CHANNEL_ID=<你的 Channel ID      例: channel-xxxxxxxxxxxxxxxx>
      # LINE_CHANNEL_SECRET=<你的 Channel Secret 例: f5e3d0...>
      # LINE_CHANNEL_TOKEN=<long-lived token    例: 7xxxx...>
      # LINE_BASE_URL=<預設官方, 不用改 例: https://api.line.me>
    restart: unless-stopped

  # SQLite 網頁管理介面（sqlite-web）：http://localhost:8091
  # 給管理者直接用瀏覽器看 DB、跑 SQL。與 autorepairos 共用同一個 named volume 的 DB。
  # 注意：sqlite-web 是開發/除錯工具，正式環境若不需要可移除本服務。
  # 安全修正（T0.1）：
  #   1. profiles: ["debug"] → 預設不啟動，需明確 --profile debug 或指定服務名
  #   2. 只綁 127.0.0.1 → 即使啟動也不對區網公開
  # 啟動方式：docker compose --profile debug up -d
  #         或 docker compose up -d sqlite-web
  sqlite-web:
    image: coleifer/sqlite-web:latest
    profiles: ["debug"]
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - autorepairos-data:/data:ro
    command: ["sqlite_web", "/data/autorepair.db", "--host", "0.0.0.0", "--port", "8080", "--read-only"]
    restart: unless-stopped

  # 視覺辨識本地 LLM（Docker 模式）：Ollama + qwen2.5vl:3b。
  # 容器名固定 ollama_local（對應使用文件裡的 docker exec -it ollama_local ...）。
  # 不對外開埠：autorepairos 走 docker 內部網路 http://ollama:11434 存取；
  # 模型存在 ollama-data named volume，換 autorepairos 版本不會重拉。
  # 首次使用要拉模型：docker exec -it ollama_local ollama pull qwen2.5vl:3b
  # 或直接跑：docker exec -it ollama_local ollama run qwen2.5vl:3b
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_local
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  autorepairos-data:
  ollama-data: