<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoRepair OS - 首頁</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <span class="text-xl font-bold text-indigo-600">AutoRepair OS</span>
        </div>
        <div class="flex items-center space-x-4">
          <a href="/api/customers" class="text-gray-600 hover:text-indigo-600 text-sm">客戶列表</a>
          <a href="/api/workorders" class="text-gray-600 hover:text-indigo-600 text-sm">工單列表</a>
          <a href="/logout" class="text-gray-600 hover:text-red-600 text-sm">登出</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-lg shadow overflow-hidden sm:rounded-lg">
      <div class="px-4 py-5 sm:px-6 bg-indigo-50 rounded-t-lg">
        <h3 class="text-lg leading-6 font-medium text-gray-900">歡迎使用 AutoRepair OS</h3>
        <p class="mt-1 max-w-2xl text-sm text-gray-500">汽車修護廠區域網路管理系統</p>
      </div>
      <div class="border-t border-gray-200">
        <p>系統已成功啟動！</p>
        <p class="mt-2 text-sm text-gray-600">您可以透過以下 API 測試功能：</p>
        <ul class="list-disc list-inside text-sm text-gray-600 mt-2">
          <li><code>GET /api/customers</code> - 獲取客戶列表</li>
          <li><code>GET /api/workorders</code> - 獲取工單列表</li>
          <li><code>POST /api/workorders</code> - 建立新工單</li>
        </ul>
        <p class="mt-4 text-sm text-gray-500">請使用瀏覽器重新整理頁面以獲取最新資料。</p>
      </div>
    </div>
  </main>
</body>
</html>
