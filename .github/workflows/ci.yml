name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test (internal + cmd + web)
        run: go test ./internal/... ./cmd/... ./web/... -count=1
      - name: Templ drift
        run: go run github.com/a-h/templ/cmd/templ@v0.3.1100 generate -check -path web && go run github.com/a-h/templ/cmd/templ@v0.3.1100 generate -check -path release/web
      - name: Build Go packages
        run: go build ./...
      - name: Build Linux container
        run: docker build --tag autorepairos:ci .
